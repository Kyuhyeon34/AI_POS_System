; 빵 촬영용 턴테이블 펌웨어 (STM32 Nucleo + ULN2003 + 28BYJ-48)
;
; 젯슨이 USB 시리얼로 명령을 보내면 이 보드가 모터를 돌린다.
; Nucleo 는 ST-Link 가 USB 시리얼로도 잡히므로 케이블 하나로 업로드와 통신이 다 된다.
;
; 보드가 다르면 board 만 바꾸면 된다.
;   nucleo_f401re / nucleo_f411re / nucleo_f103rb / nucleo_f446re / nucleo_l476rg ...
;   목록:  pio boards nucleo

[env:nucleo]
platform = ststm32
board = nucleo_f401re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
